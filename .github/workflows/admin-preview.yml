name: Deploy GENESIS Admin Preview

on:
  workflow_dispatch:
  push:
    branches:
      - feat/admin-manuscript-viewer

permissions:
  contents: read

concurrency:
  group: genesis-site-control-center-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/feat/admin-manuscript-viewer'
    environment: genesis-admin-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout approved preview preparation branch
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run types

      - name: Upload isolated Cloudflare preview version
        id: upload-preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --env preview --keep-vars --strict

      - name: Verify uploaded runtime bindings
        env:
          WRANGLER_OUTPUT: ${{ steps.upload-preview.outputs.command-output }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          VERSION_ID="$(printf '%s\n' "$WRANGLER_OUTPUT" | sed -n 's/.*Worker Version ID: //p' | tail -n 1)"
          if [ -z "$VERSION_ID" ]; then
            echo "Could not resolve the uploaded Worker Version ID."
            exit 1
          fi
          npx wrangler versions view "$VERSION_ID" --env preview --json > /tmp/genesis-version.json
          python - <<'PY'
          import json, sys
          with open('/tmp/genesis-version.json', encoding='utf-8') as f:
              data=json.load(f)
          names=set()
          def walk(v):
              if isinstance(v, dict):
                  for k,val in v.items():
                      if k in {'name','binding'} and isinstance(val,str):
                          names.add(val)
                      walk(val)
              elif isinstance(v, list):
                  for x in v: walk(x)
          walk(data)
          required={'SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY','CF_ACCESS_TEAM_DOMAIN','CF_ACCESS_AUD','ADMIN_EMAILS'}
          missing=sorted(required-names)
          print("Runtime binding names present:", ", ".join(sorted(required & names)))
          if missing:
              print("Missing required runtime bindings:", ", ".join(missing))
              sys.exit(1)
          print("Required runtime bindings verified without exposing values.")
          PY

      - name: Verify preview auth gate before promotion
        env:
          WRANGLER_OUTPUT: ${{ steps.upload-preview.outputs.command-output }}
        run: |
          set -euo pipefail
          VERSION_URL="$(printf '%s\n' "$WRANGLER_OUTPUT" | grep -Eo 'https://[A-Za-z0-9.-]+workers\.dev' | tail -n 1)"
          if [ -z "$VERSION_URL" ]; then
            echo "Could not resolve the uploaded version URL."
            exit 1
          fi
          STATUS="$(curl -sS -D /tmp/genesis-preview-headers.txt -o /tmp/genesis-preview-check.txt -w '%{http_code}' "$VERSION_URL/site-preview/")"
          echo "Unauthenticated version check returned HTTP $STATUS"
          if [ "$STATUS" = "401" ]; then
            echo "Worker authentication gate verified."
          elif [ "$STATUS" = "302" ] && grep -Eiq '^(location:.*(cloudflareaccess|/cdn-cgi/access))' /tmp/genesis-preview-headers.txt; then
            echo "Cloudflare Access redirect gate verified."
          else
            echo "Expected a protected 401 or Cloudflare Access 302 before promotion."
            cat /tmp/genesis-preview-headers.txt
            cat /tmp/genesis-preview-check.txt
            exit 1
          fi

      - name: Safety reminder
        run: |
          echo "Preview version uploaded."
          echo "No production route or custom domain is configured."
          echo "Do not attach the live GENESIS hostname to this Worker."

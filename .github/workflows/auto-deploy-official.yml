name: Auto Deploy GENESIS Official Website

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: genesis-auto-deploy-official-main
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
      merge_sha: ${{ steps.meta.outputs.merge_sha }}
      pr_number: ${{ steps.meta.outputs.pr_number }}
    steps:
      - name: Capture immutable merge metadata
        id: meta
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$BASE_REF" = "main"
          test -n "$MERGE_SHA"
          test "$MERGE_SHA" != "null"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Merged PR #$PR_NUMBER -> $MERGE_SHA"

      - name: Classify changed files — public website only
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No changed files returned for merged PR #$PR_NUMBER."
            exit 1
          fi

          eligible=true
          deployable=false
          blocked=()

          printf 'Changed files:\n'
          printf '  %s\n' "${FILES[@]}"

          for file in "${FILES[@]}"; do
            case "$file" in
              public/site-preview/*|public/assets/*)
                deployable=true
                ;;
              *)
                eligible=false
                blocked+=("$file")
                ;;
            esac
          done

          if [ "$deployable" != "true" ]; then
            eligible=false
          fi

          if [ "$eligible" = "true" ]; then
            echo "PASS: PR is public-site-only and eligible for automatic deployment."
          else
            echo "::notice::Automatic live deployment skipped. Only public/site-preview/** and public/assets/** are auto-deployable."
            if [ "${#blocked[@]}" -gt 0 ]; then
              printf 'Blocked/manual-only path: %s\n' "${blocked[@]}"
            fi
          fi

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Checkout exact merge commit
        if: steps.scope.outputs.eligible == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.merge_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify merge commit is on current main
        if: steps.scope.outputs.eligible == 'true'
        env:
          MERGE_SHA: ${{ steps.meta.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$MERGE_SHA" origin/main
          echo "PASS: exact deployment SHA is reachable from current main."

      - name: Wait for all main-commit QA gates
        if: steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ steps.meta.outputs.merge_sha }}
        run: |
          set -euo pipefail
          required=(
            "GENESIS Production Readiness Gate"
            "GENESIS Unified Shell QA"
            "GENESIS Website Visual QA"
          )

          for attempt in $(seq 1 45); do
            runs="$(gh api "repos/$REPO/actions/runs?head_sha=$MERGE_SHA&event=push&per_page=100")"
            all_green=true

            echo "QA poll $attempt/45 for merge $MERGE_SHA"
            for name in "${required[@]}"; do
              row="$(printf '%s' "$runs" | jq -r --arg name "$name" '
                [.workflow_runs[] | select(.name == $name)]
                | sort_by(.run_number)
                | last
                | if . == null then "missing\t\t" else [.status, (.conclusion // ""), .html_url] | @tsv end
              ')"
              IFS=$'\t' read -r status conclusion url <<< "$row"
              echo "  $name -> status=${status:-missing} conclusion=${conclusion:-pending}"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::$name failed for merge $MERGE_SHA ($conclusion). $url"
                  exit 1
                fi
              else
                all_green=false
              fi
            done

            if [ "$all_green" = "true" ]; then
              echo "PASS: all three QA gates succeeded on the exact main merge commit."
              exit 0
            fi
            sleep 20
          done

          echo "::error::Timed out waiting for all three QA gates on merge $MERGE_SHA."
          exit 1

  deploy-official:
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    uses: ./.github/workflows/deploy-live.yml
    with:
      deploy_ref: ${{ needs.gate.outputs.merge_sha }}
      source_pr: ${{ needs.gate.outputs.pr_number }}
    secrets: inherit

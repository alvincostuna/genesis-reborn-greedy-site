name: Auto Deploy GENESIS Official Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: genesis-auto-deploy-official-main
  cancel-in-progress: false

jobs:
  gate:
    # Do not hold the self-hosted deployment/QA runner while polling QA.
    # The actual deploy remains self-hosted through deploy-live.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
      merge_sha: ${{ steps.meta.outputs.merge_sha }}
      pr_number: ${{ steps.scope.outputs.pr_number }}
    steps:
      - name: Preflight self-hosted gate dependencies
        run: |
          set -euo pipefail
          required=(bash curl python3)
          missing=()
          for cmd in "${required[@]}"; do
            command -v "$cmd" >/dev/null 2>&1 || missing+=("$cmd")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing self-hosted gate dependency: %s\n' "${missing[@]}"
            exit 1
          fi
          echo "PASS: self-hosted gate dependencies present: ${required[*]}"

      - name: Capture immutable main commit
        id: meta
        env:
          MERGE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$REF_NAME" = "main"
          test -n "$MERGE_SHA"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "Main candidate SHA: $MERGE_SHA"

      - name: Resolve merged PR and classify changed files
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ steps.meta.outputs.merge_sha }}
        run: |
          set -euo pipefail
          PRS="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/commits/$MERGE_SHA/pulls?per_page=20")"
          mapfile -t MATCHES < <(printf '%s' "$PRS" | python3 -c 'import json,sys; sha=sys.argv[1]; [print(x["number"]) for x in json.load(sys.stdin) if x.get("base",{}).get("ref")=="main" and x.get("merged_at") is not None and x.get("merge_commit_sha")==sha]' "$MERGE_SHA")

          if [ "${#MATCHES[@]}" -eq 0 ]; then
            echo "::notice::Main commit $MERGE_SHA is not the exact merge commit of a merged PR. Automatic deployment skipped."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#MATCHES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one merged PR for $MERGE_SHA; found ${#MATCHES[@]}."
            exit 1
          fi

          PR_NUMBER="${MATCHES[0]}"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          mapfile -t FILES < <(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" | python3 -c 'import json,sys; [print(x["filename"]) for x in json.load(sys.stdin)]')

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No changed files returned for merged PR #$PR_NUMBER."
            exit 1
          fi

          eligible=true
          deployable=false
          blocked=()

          printf 'Merged PR #%s changed files:\n' "$PR_NUMBER"
          printf '  %s\n' "${FILES[@]}"

          for file in "${FILES[@]}"; do
            case "$file" in
              public/site-preview/*|public/assets/*)
                deployable=true
                ;;
              *)
                eligible=false
                blocked+=("$file")
                ;;
            esac
          done

          if [ "$deployable" != "true" ]; then
            eligible=false
          fi

          if [ "$eligible" = "true" ]; then
            echo "PASS: merged PR #$PR_NUMBER is public-site-only and eligible for automatic deployment."
          else
            echo "::notice::Automatic deployment skipped. Only public/site-preview/** and public/assets/** are auto-deployable."
            if [ "${#blocked[@]}" -gt 0 ]; then
              printf 'Blocked/manual-only path: %s\n' "${blocked[@]}"
            fi
          fi

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Wait for all exact-SHA QA gates
        if: steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ steps.meta.outputs.merge_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.request

          repo=os.environ["REPO"]
          sha=os.environ["MERGE_SHA"]
          token=os.environ["GH_TOKEN"]
          required={"source-gate","unified-shell","visual-qa"}
          url=f"https://api.github.com/repos/{repo}/commits/{sha}/check-runs?per_page=100"
          headers={
              "Accept":"application/vnd.github+json",
              "Authorization":f"Bearer {token}",
              "X-GitHub-Api-Version":"2022-11-28",
          }

          for attempt in range(1,46):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as resp:
                  data=json.load(resp)

              latest={}
              for run in data.get("check_runs",[]):
                  name=run.get("name")
                  if name not in required:
                      continue
                  # Prefer the newest matching check run if duplicates exist.
                  prev=latest.get(name)
                  if prev is None or (run.get("id") or 0) > (prev.get("id") or 0):
                      latest[name]=run

              print(f"QA poll {attempt}/45 for main commit {sha}")
              all_green=True
              for name in sorted(required):
                  run=latest.get(name)
                  if not run:
                      print(f"  {name} -> missing")
                      all_green=False
                      continue
                  status=run.get("status") or ""
                  conclusion=run.get("conclusion") or ""
                  url_out=run.get("details_url") or ""
                  print(f"  {name} -> status={status} conclusion={conclusion} {url_out}")
                  if status=="completed":
                      if conclusion!="success":
                          print(f"::error::{name} failed for {sha} ({conclusion}). {url_out}")
                          sys.exit(1)
                  else:
                      all_green=False

              if all_green:
                  print("PASS: all three exact-SHA QA check runs succeeded.")
                  sys.exit(0)
              time.sleep(20)

          print(f"::error::Timed out waiting for exact-SHA QA checks on {sha}.")
          sys.exit(1)
          PY

      - name: Fail closed if main advanced before deployment
        if: steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ steps.meta.outputs.merge_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/commits/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          echo "Candidate:    $MERGE_SHA"
          echo "Current main: $CURRENT_MAIN"
          if [ "$CURRENT_MAIN" != "$MERGE_SHA" ]; then
            echo "::error::Main advanced while QA was running. Refusing to deploy a stale merge; the newer main run will decide deployment."
            exit 1
          fi
          echo "PASS: candidate is still the current main commit."

  deploy-official:
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    uses: ./.github/workflows/deploy-live.yml
    with:
      deploy_ref: ${{ needs.gate.outputs.merge_sha }}
      source_pr: ${{ needs.gate.outputs.pr_number }}
    secrets: inherit

name: Auto Deploy GENESIS Official Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: genesis-auto-deploy-official-main
  cancel-in-progress: false

jobs:
  gate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
      merge_sha: ${{ steps.meta.outputs.merge_sha }}
      pr_number: ${{ steps.scope.outputs.pr_number }}
    steps:
      - name: Capture immutable main commit
        id: meta
        env:
          MERGE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$REF_NAME" = "main"
          test -n "$MERGE_SHA"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "Main candidate SHA: $MERGE_SHA"

      - name: Resolve merged PR and classify changed files
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ steps.meta.outputs.merge_sha }}
        run: |
          set -euo pipefail
          PRS="$(gh api -H "Accept: application/vnd.github+json" "repos/$REPO/commits/$MERGE_SHA/pulls?per_page=20")"
          mapfile -t MATCHES < <(printf '%s' "$PRS" | jq -r --arg sha "$MERGE_SHA" '.[] | select(.base.ref=="main" and .merged_at!=null and .merge_commit_sha==$sha) | .number')

          if [ "${#MATCHES[@]}" -eq 0 ]; then
            echo "::notice::Main commit $MERGE_SHA is not the exact merge commit of a merged PR. Automatic deployment skipped."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#MATCHES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one merged PR for $MERGE_SHA; found ${#MATCHES[@]}."
            exit 1
          fi

          PR_NUMBER="${MATCHES[0]}"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          mapfile -t FILES < <(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No changed files returned for merged PR #$PR_NUMBER."
            exit 1
          fi

          eligible=true
          deployable=false
          blocked=()

          printf 'Merged PR #%s changed files:\n' "$PR_NUMBER"
          printf '  %s\n' "${FILES[@]}"

          for file in "${FILES[@]}"; do
            case "$file" in
              public/site-preview/*|public/assets/*)
                deployable=true
                ;;
              *)
                eligible=false
                blocked+=("$file")
                ;;
            esac
          done

          if [ "$deployable" != "true" ]; then
            eligible=false
          fi

          if [ "$eligible" = "true" ]; then
            echo "PASS: merged PR #$PR_NUMBER is public-site-only and eligible for automatic deployment."
          else
            echo "::notice::Automatic deployment skipped. Only public/site-preview/** and public/assets/** are auto-deployable."
            if [ "${#blocked[@]}" -gt 0 ]; then
              printf 'Blocked/manual-only path: %s\n' "${blocked[@]}"
            fi
          fi

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Wait for all exact-SHA QA gates
        if: steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ steps.meta.outputs.merge_sha }}
        run: |
          set -euo pipefail
          required=(
            "GENESIS Production Readiness Gate"
            "GENESIS Unified Shell QA"
            "GENESIS Website Visual QA"
          )

          for attempt in $(seq 1 45); do
            runs="$(gh api "repos/$REPO/actions/runs?head_sha=$MERGE_SHA&event=push&per_page=100")"
            all_green=true

            echo "QA poll $attempt/45 for main commit $MERGE_SHA"
            for name in "${required[@]}"; do
              row="$(printf '%s' "$runs" | jq -r --arg name "$name" '
                [.workflow_runs[] | select(.name == $name)]
                | sort_by(.run_number)
                | last
                | if . == null then "missing\t\t" else [.status, (.conclusion // ""), .html_url] | @tsv end
              ')"
              IFS=$'\t' read -r status conclusion url <<< "$row"
              echo "  $name -> status=${status:-missing} conclusion=${conclusion:-pending}"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::$name failed for main commit $MERGE_SHA ($conclusion). $url"
                  exit 1
                fi
              else
                all_green=false
              fi
            done

            if [ "$all_green" = "true" ]; then
              echo "PASS: all three QA gates succeeded on the exact main commit."
              exit 0
            fi
            sleep 20
          done

          echo "::error::Timed out waiting for all three QA gates on $MERGE_SHA."
          exit 1

      - name: Fail closed if main advanced before deployment
        if: steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ steps.meta.outputs.merge_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/$REPO/commits/main" --jq '.sha')"
          echo "Candidate:    $MERGE_SHA"
          echo "Current main: $CURRENT_MAIN"
          if [ "$CURRENT_MAIN" != "$MERGE_SHA" ]; then
            echo "::error::Main advanced while QA was running. Refusing to deploy a stale merge; the newer main run will decide deployment."
            exit 1
          fi
          echo "PASS: candidate is still the current main commit."

  deploy-official:
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    uses: ./.github/workflows/deploy-live.yml
    with:
      deploy_ref: ${{ needs.gate.outputs.merge_sha }}
      source_pr: ${{ needs.gate.outputs.pr_number }}
    secrets: inherit

name: Deploy GENESIS Admin Preview

on:
  push:
    branches:
      - feat/admin-manuscript-viewer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-admin-preview
  cancel-in-progress: true

jobs:
  diagnose-install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Admin JavaScript
        run: |
          node --check public/admin/admin.js
          echo "INSTALL_AND_JS_PASS"

name: Deploy GENESIS Admin Preview

on:
  push:
    branches:
      - feat/admin-manuscript-viewer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-admin-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    environment: genesis-admin-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout preview source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Admin JavaScript
        run: node --check public/admin/admin.js

      - name: Upload protected preview version
        id: upload-preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --env preview --keep-vars

      - name: Promote uploaded version to preview
        env:
          WRANGLER_OUTPUT: ${{ steps.upload-preview.outputs.command-output }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          VERSION_ID="$(printf '%s\n' "$WRANGLER_OUTPUT" | sed -n 's/.*Worker Version ID: //p' | tail -n 1)"
          if [ -z "$VERSION_ID" ]; then
            echo "Could not resolve uploaded preview Worker Version ID."
            printf '%s\n' "$WRANGLER_OUTPUT"
            exit 1
          fi
          npx wrangler versions deploy "$VERSION_ID" --env preview --yes
          echo "Preview Worker promoted: $VERSION_ID"

      - name: Verify protected preview
        run: |
          set -euo pipefail
          BASE="https://genesis-reborn-greedy-site-preview.hirangnalupa.workers.dev"
          for path in /admin/ /admin/admin.js /admin/admin.css; do
            STATUS="$(curl -sS -o /tmp/preview.out -w '%{http_code}' "$BASE$path" || true)"
            echo "Preview $path -> HTTP $STATUS"
            case "$STATUS" in
              200|302|401|403) ;;
              *) exit 1 ;;
            esac
          done

      - name: Safety reminder
        run: |
          echo "Protected preview Worker updated only."
          echo "No live GENESIS public route was changed."

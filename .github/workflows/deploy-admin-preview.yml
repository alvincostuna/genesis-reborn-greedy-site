name: Deploy GENESIS Admin Preview

on:
  push:
    branches:
      - feat/admin-manuscript-viewer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-admin-preview
  cancel-in-progress: true

jobs:
  diagnose-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4

      - name: Verify repository checkout
        run: |
          set -euo pipefail
          test -f package.json
          test -f public/admin/admin.js
          test -f public/admin/admin.css
          test -f wrangler.toml
          echo "CHECKOUT_PASS"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node
        run: |
          node --version
          npm --version
          node --check public/admin/admin.js
          echo "NODE_PASS"

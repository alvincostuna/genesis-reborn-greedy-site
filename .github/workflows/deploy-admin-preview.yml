name: Deploy GENESIS Admin Preview

on:
  push:
    branches:
      - feat/admin-manuscript-viewer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-admin-preview
  cancel-in-progress: true

jobs:
  audit-admin-js:
    name: Audit Admin JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check Admin JavaScript
        run: |
          set -euo pipefail
          node --check public/admin/admin.js
          echo "ADMIN_JS_SYNTAX_PASS"

  audit-npm-install:
    name: Audit NPM install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --loglevel verbose
          npm ls --depth=0
          echo "NPM_INSTALL_PASS"

name: Deploy GENESIS Admin Preview

on:
  push:
    branches:
      - feat/admin-manuscript-viewer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-admin-preview
  cancel-in-progress: true

jobs:
  audit-admin-js:
    name: Audit Admin JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check Admin JavaScript
        run: |
          set -euo pipefail
          node --check public/admin/admin.js
          echo "ADMIN_JS_SYNTAX_PASS"

  audit-npm-install:
    name: Audit NPM install
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Show package versions
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e 'const p=require("./package.json"); console.log(JSON.stringify({dependencies:p.dependencies,devDependencies:p.devDependencies},null,2))'

      - name: Verify declared packages exist
        run: |
          set -euo pipefail
          npm view jose@6.1.0 version
          npm view typescript@5.9.2 version
          npm view wrangler@4.38.0 version
          npm view @cloudflare/workers-types@5.20260922.1 version
          echo "NPM_DECLARED_VERSIONS_PASS"

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --loglevel verbose
          echo "NPM_INSTALL_PASS"

name: One-Time GENESIS Live Promotion

on:
  push:
    branches:
      - feat/admin-manuscript-viewer

permissions:
  contents: read

concurrency:
  group: genesis-live-promotion-once
  cancel-in-progress: false

jobs:
  deploy-live-once:
    environment: genesis-admin-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout approved release
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run types

      - name: Build public-only live assets
        run: |
          set -euo pipefail
          rm -rf .live-assets
          mkdir -p .live-assets/assets
          cp public/site-preview/index.html .live-assets/index.html
          cp public/site-preview/site.css .live-assets/site.css
          cp public/site-preview/site.js .live-assets/site.js
          cp -R public/site-preview/read .live-assets/read
          cp -R public/site-preview/world .live-assets/world
          cp -R public/site-preview/codex .live-assets/codex
          cp -R public/site-preview/fan-page .live-assets/fan-page
          cp -R public/site-preview/manga .live-assets/manga
          cp -R public/site-preview/support .live-assets/support
          cp public/assets/genesis-official-logo.png .live-assets/assets/genesis-official-logo.png
          cp public/assets/genesis-official-logo-64.png .live-assets/assets/genesis-official-logo-64.png
          python - <<'PY'
          from pathlib import Path
          for p in Path('.live-assets').rglob('*.html'):
              text=p.read_text(encoding='utf-8')
              text=text.replace('/site-preview/','/')
              text=text.replace('<meta name="robots" content="noindex,nofollow">','')
              p.write_text(text,encoding='utf-8')
          js=Path('.live-assets/site.js')
          text=js.read_text(encoding='utf-8').replace("'Preview mode'","'Pre-launch'").replace("during preview","before launch")
          js.write_text(text,encoding='utf-8')
          PY

      - name: Snapshot current live deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments list --config wrangler.live.toml || true

      - name: Upload live candidate
        id: upload-live
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --config wrangler.live.toml --strict

      - name: Verify public-only candidate
        env:
          WRANGLER_OUTPUT: ${{ steps.upload-live.outputs.command-output }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          VERSION_ID="$(printf '%s\n' "$WRANGLER_OUTPUT" | sed -n 's/.*Worker Version ID: //p' | tail -n 1)"
          VERSION_URL="$(printf '%s\n' "$WRANGLER_OUTPUT" | grep -Eo 'https://[A-Za-z0-9.-]+workers\.dev' | tail -n 1)"
          test -n "$VERSION_ID"
          test -n "$VERSION_URL"

          npx wrangler versions view "$VERSION_ID" --config wrangler.live.toml --json > /tmp/live-version.json
          python - <<'PY'
          import json,sys
          data=json.load(open('/tmp/live-version.json',encoding='utf-8'))
          names=set()
          def walk(v):
              if isinstance(v,dict):
                  for k,val in v.items():
                      if k in {'name','binding'} and isinstance(val,str): names.add(val)
                      walk(val)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(data)
          forbidden={'SUPABASE_SERVICE_ROLE_KEY','CF_ACCESS_AUD','CF_ACCESS_TEAM_DOMAIN','ADMIN_EMAILS'}
          leaked=sorted(forbidden & names)
          print("Candidate binding names:",", ".join(sorted(names)) or "(none)")
          if leaked:
              print("Private binding leak:",", ".join(leaked))
              sys.exit(1)
          PY

          curl -fsS "$VERSION_URL/" -o /tmp/home.html
          grep -q 'data-page="home"' /tmp/home.html
          grep -q 'GENESIS CYCLE' /tmp/home.html
          grep -q '/assets/genesis-official-logo.png' /tmp/home.html
          ! grep -q '/site-preview/' /tmp/home.html
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$VERSION_URL/admin/")" = "404"

      - name: Promote verified candidate
        env:
          WRANGLER_OUTPUT: ${{ steps.upload-live.outputs.command-output }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          VERSION_ID="$(printf '%s\n' "$WRANGLER_OUTPUT" | sed -n 's/.*Worker Version ID: //p' | tail -n 1)"
          npx wrangler versions deploy "$VERSION_ID" --config wrangler.live.toml --yes

      - name: Verify stable live site
        run: |
          set -euo pipefail
          BASE="https://genesis-reborn-greedy.hirangnalupa.workers.dev"
          for path in / /read/ /world/ /codex/ /fan-page/ /manga/ /support/; do
            STATUS="$(curl -sS -o /tmp/page.html -w '%{http_code}' "$BASE$path")"
            echo "$path -> HTTP $STATUS"
            test "$STATUS" = "200"
          done
          curl -fsS "$BASE/" -o /tmp/home.html
          grep -q 'data-page="home"' /tmp/home.html
          grep -q 'GENESIS CYCLE' /tmp/home.html
          grep -q '/assets/genesis-official-logo.png' /tmp/home.html
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/admin/")" = "404"
          echo "GENESIS live reader promotion verified."

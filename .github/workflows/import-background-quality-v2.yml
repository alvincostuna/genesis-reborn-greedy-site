name: Import Background Quality Repair V2

on:
  push:
    branches:
      - art/background-quality-repair-v2

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/background-quality-repair-v2
          fetch-depth: 0
      - name: Download replacement WebPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/portal-v1/backgrounds/batch1
          curl -L --fail --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-b93c-8211-a89d-2389d1605fbd/raw?se=2026-10-04T16%3A03%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=b03474f6-fbdc-5071-9e0d-230fca6bcdb4&skoid=45d5558d-260a-4eed-aec4-6bc512bdfda4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T11%3A36%3A52Z&ske=2026-10-05T11%3A36%3A52Z&sks=b&skv=2026-02-06&sig=j/SLGJiSaC8/Z7m766kk9W0O76S91UIcLfv85mr6J6o%3D' -o public/assets/portal-v1/backgrounds/batch1/monsters-v2.webp
          curl -L --fail --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-b1c8-8211-8bd6-f0689558996f/raw?se=2026-10-04T16%3A03%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=a42cb814-bafd-5a17-af33-1032b6c6aa46&skoid=45d5558d-260a-4eed-aec4-6bc512bdfda4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T03%3A10%3A07Z&ske=2026-10-05T03%3A10%3A07Z&sks=b&skv=2026-02-06&sig=tSYppsG6UfB02nJ5T1xQ/DI9jIZgvLa2TIkd%2Bl6s%2BKM%3D' -o public/assets/portal-v1/backgrounds/batch1/codex-v2.webp
          curl -L --fail --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-f1d4-8211-9889-51e93cb74a99/raw?se=2026-10-04T16%3A04%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=9c18a13c-ce67-5320-95a9-9f8fd7b54c5d&skoid=45d5558d-260a-4eed-aec4-6bc512bdfda4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T11%3A36%3A44Z&ske=2026-10-05T11%3A36%3A44Z&sks=b&skv=2026-02-06&sig=A4H8W1QzY3iufPgAJpfJcdX4esnMy1Z7BbVsGc1cj9s%3D' -o public/assets/portal-v1/backgrounds/batch1/manga-v2.webp
          curl -L --fail --retry 3 'https://sdmntprseasia.oaiusercontent.com/files/00000000-adc8-8207-964e-a1eb1a811abd/raw?se=2026-10-04T16%3A04%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=629b4658-2e89-54df-b91f-39c4a8b57ec2&skoid=45d5558d-260a-4eed-aec4-6bc512bdfda4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T03%3A10%3A07Z&ske=2026-10-05T03%3A10%3A07Z&sks=b&skv=2026-02-06&sig=XC7vTA5dV/CzrAEvbkztKdjl%2B/TbS1F2WP8u4wk%2BLh4%3D' -o public/assets/portal-v1/backgrounds/batch1/continue-story-v3.webp
          for f in public/assets/portal-v1/backgrounds/batch1/*-v2.webp public/assets/portal-v1/backgrounds/batch1/continue-story-v3.webp; do
            test -s "$f"
            head -c 4 "$f" | grep -q RIFF
          done
      - name: Commit assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/portal-v1/backgrounds/batch1/monsters-v2.webp \
                  public/assets/portal-v1/backgrounds/batch1/codex-v2.webp \
                  public/assets/portal-v1/backgrounds/batch1/manga-v2.webp \
                  public/assets/portal-v1/backgrounds/batch1/continue-story-v3.webp
          git diff --cached --quiet && exit 0
          git commit -m "Import Batch 1 quality replacement backgrounds"
          git push origin HEAD:art/background-quality-repair-v2

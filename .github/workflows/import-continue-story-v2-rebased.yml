name: Import Continue Story V2 Rebased

on:
  push:
    branches:
      - art/portal-background-batch1-redteam-repair-v2

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/portal-background-batch1-redteam-repair-v2
          fetch-depth: 0
      - name: Download Continue Story V2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/portal-v1/backgrounds/batch1
          curl -L --fail --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-4da0-8211-814c-c6df7312bcb7/raw?se=2026-10-04T08%3A45%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=549cf9dd-12d4-53fd-9785-50a2b9e2e18b&skoid=45d5558d-260a-4eed-aec4-6bc512bdfda4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T06%3A31%3A07Z&ske=2026-10-05T06%3A31%3A07Z&sks=b&skv=2026-02-06&sig=5SaD%2BKjzDT42pcyGQmEE62U5Br8Ey9UJkaUZvCvhB1o%3D' -o public/assets/portal-v1/backgrounds/batch1/continue-story-v2.webp
          test -s public/assets/portal-v1/backgrounds/batch1/continue-story-v2.webp
          head -c 4 public/assets/portal-v1/backgrounds/batch1/continue-story-v2.webp | grep -q RIFF
      - name: Commit asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/portal-v1/backgrounds/batch1/continue-story-v2.webp
          git diff --cached --quiet && exit 0
          git commit -m "Import Continue Story V2 background"
          git push origin HEAD:art/portal-background-batch1-redteam-repair-v2

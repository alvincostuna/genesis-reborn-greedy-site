name: Import Continue Story V2

on:
  push:
    branches:
      - art/portal-background-batch1-redteam-repair

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/portal-background-batch1-redteam-repair
          fetch-depth: 0
      - name: Download Continue Story V2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/portal-v1/backgrounds/batch1
          curl -L --fail --retry 3 'https://sdmntprseasia.oaiusercontent.com/files/00000000-2b44-8207-a767-2051219b443f/raw?se=2026-10-04T08%3A38%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=af3e4336-d938-5351-9205-8427dbfbb353&skoid=45d5558d-260a-4eed-aec4-6bc512bdfda4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T00%3A41%3A00Z&ske=2026-10-05T00%3A41%3A00Z&sks=b&skv=2026-02-06&sig=HqT/yq6NNLh5ibqOrASiS9POHdxHTF2VxIT7pI84qjk%3D' -o public/assets/portal-v1/backgrounds/batch1/continue-story-v2.webp
          test -s public/assets/portal-v1/backgrounds/batch1/continue-story-v2.webp
          head -c 4 public/assets/portal-v1/backgrounds/batch1/continue-story-v2.webp | grep -q RIFF
      - name: Commit asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/portal-v1/backgrounds/batch1/continue-story-v2.webp
          git diff --cached --quiet && exit 0
          git commit -m "Import Continue Story V2 background"
          git push origin HEAD:art/portal-background-batch1-redteam-repair

name: Import Portal Background Batch 2 Lower

on:
  push:
    branches:
      - art/portal-background-batch2-lower

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/portal-background-batch2-lower
          fetch-depth: 0
      - name: Download approved Batch 2 WebPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/portal-v1/backgrounds/batch2
          curl -L --fail --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-46b0-8211-ba89-2e34b1629f72/raw?se=2026-10-04T17%3A26%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=cc6a26ac-33cc-5ea9-9a83-709da9e39c42&skoid=45d5558d-260a-4eed-aec4-6bc512bdfda4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T16%3A56%3A01Z&ske=2026-10-05T16%3A56%3A01Z&sks=b&skv=2026-02-06&sig=CZUuktIdEjpT0iS4CQ8zj/e4o7cZpe6eJ2ekH/MPdGY%3D' -o public/assets/portal-v1/backgrounds/batch2/featured-region.webp
          curl -L --fail --retry 3 'https://sdmntprseasia.oaiusercontent.com/files/00000000-2618-8207-a3e9-abb80d43b722/raw?se=2026-10-04T17%3A26%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=4a68b898-b4e6-5663-b6fa-e94d5a5897d7&skoid=45d5558d-260a-4eed-aec4-6bc512bdfda4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T04%3A00%3A13Z&ske=2026-10-05T04%3A00%3A13Z&sks=b&skv=2026-02-06&sig=sO9lLljY9VbPmPaUGhJA74HfKT1bJco5xidKEztxS/g%3D' -o public/assets/portal-v1/backgrounds/batch2/featured-monster.webp
          curl -L --fail --retry 3 'https://sdmntprseasia.oaiusercontent.com/files/00000000-cc24-8207-a3cd-b3d0edea9113/raw?se=2026-10-04T17%3A26%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=e1bd19a4-0648-588d-89ab-68ce97ed2ada&skoid=45d5558d-260a-4eed-aec4-6bc512bdfda4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T03%3A10%3A07Z&ske=2026-10-05T03%3A10%3A07Z&sks=b&skv=2026-02-06&sig=%2B95otUvmE7xDPAbHM09Uy9WxGpBNuJOFReMiJMNUmP4%3D' -o public/assets/portal-v1/backgrounds/batch2/featured-item.webp
          curl -L --fail --retry 3 'https://sdmntprcentralindia.oaiusercontent.com/files/00000000-f4b4-8208-a48c-9e5db7bdf53e/raw?se=2026-10-04T17%3A26%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=ace01a94-53e0-5049-bac4-f40601da7919&skoid=45d5558d-260a-4eed-aec4-6bc512bdfda4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T01%3A26%3A17Z&ske=2026-10-05T01%3A26%3A17Z&sks=b&skv=2026-02-06&sig=E79oAdLFVc/iVwJQmqroFMgxpRaPKnRhVl6tPt7rsqk%3D' -o public/assets/portal-v1/backgrounds/batch2/community-v2.webp
          curl -L --fail --retry 3 'https://sdmntprseasia.oaiusercontent.com/files/00000000-e3c8-8207-ac40-21d6ad98420c/raw?se=2026-10-04T17%3A26%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=c1fdbb08-082f-5dcf-a0c9-460297ecaba9&skoid=45d5558d-260a-4eed-aec4-6bc512bdfda4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T03%3A10%3A07Z&ske=2026-10-05T03%3A10%3A07Z&sks=b&skv=2026-02-06&sig=EQs%2BLRb6/tOzN201h8hPPzlVcoMsHbvbIOiluOj8jzU%3D' -o public/assets/portal-v1/backgrounds/batch2/support-fan-page.webp
          for f in public/assets/portal-v1/backgrounds/batch2/*.webp; do
            test -s "$f"
            head -c 4 "$f" | grep -q RIFF
          done
      - name: Commit assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/portal-v1/backgrounds/batch2
          git diff --cached --quiet && exit 0
          git commit -m "Import approved Portal lower background batch"
          git push origin HEAD:art/portal-background-batch2-lower

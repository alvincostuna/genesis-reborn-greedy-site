name: Post-deploy Live Dashboard QA Capture

on:
  push:
    branches:
      - postdeploy-live-dashboard-qa
    paths:
      - ".github/workflows/postdeploy-live-dashboard-qa.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --legacy-peer-deps --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture live viewports
        run: |
          cat > /tmp/capture-live.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url='https://genesis-reborn-greedy.hirangnalupa.workers.dev/';
          const viewports=[
            ['1920x1080',1920,1080],
            ['1440x900',1440,900],
            ['1366x768',1366,768],
            ['1024x768',1024,768],
            ['820x1180',820,1180],
            ['430x932',430,932],
            ['390x844',390,844],
            ['360x800',360,800],
          ];
          fs.rmSync('qa-captures',{recursive:true,force:true});
          fs.mkdirSync('qa-captures',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const report=[];
          for (const [name,width,height] of viewports){
            const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(3500);
            await page.evaluate(async()=>{
              await Promise.all([...document.images].map(img=>img.complete?Promise.resolve():new Promise(r=>{img.addEventListener('load',r,{once:true});img.addEventListener('error',r,{once:true})})));
              if(document.fonts?.ready) await document.fonts.ready;
            });
            const state=await page.evaluate(()=>{
              const q=s=>document.querySelector(s);
              const r=el=>el?(()=>{const x=el.getBoundingClientRect();return {x:x.x,y:x.y,w:x.width,h:x.height}})():null;
              const style=el=>el?getComputedStyle(el):null;
              const tiles=['read','world','codex','characters','monsters','items','manga','support','fan'];
              return {
                href:location.href,
                title:document.title,
                innerWidth,
                innerHeight,
                scrollWidth:document.documentElement.scrollWidth,
                hero:r(q('.cinematic-split-hero')),
                nav:r(q('.game-nav.v2-nav')),
                deck:r(q('.genesis-player-console')),
                release:r(q('.deck-release-panel')),
                reading:r(q('.deck-reading-panel')),
                access:r(q('.deck-access-panel')),
                feed:r(q('.adventure-feed-panel')),
                bulletin:r(q('.bulletin-panel')),
                tiles:Object.fromEntries(tiles.map(t=>[t,r(q('.tile-'+t))])),
                heroPoster:q('.cinematic-hero-poster')?{
                  objectFit:style(q('.cinematic-hero-poster')).objectFit,
                  objectPosition:style(q('.cinematic-hero-poster')).objectPosition,
                  transform:style(q('.cinematic-hero-poster')).transform
                }:null
              };
            });
            await page.screenshot({path:`qa-captures/live-${name}.png`,fullPage:true});
            report.push({name,status:res?.status()||0,errors,state});
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('qa-captures/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          JS
          node /tmp/capture-live.mjs
      - name: Commit live QA captures
        run: |
          git config user.name "genesis-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add qa-captures
          git commit -m "QA: capture live dashboard at locked viewports"
          git push

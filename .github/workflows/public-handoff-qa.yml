name: GENESIS Public Handoff QA

on:
  push:
    branches:
      - website-public-handoff-v1
  pull_request:
    branches:
      - main
    paths:
      - "public/site-preview/site.js"
      - "docs/PUBLIC_HANDOFF_READINESS.md"
      - ".github/workflows/public-handoff-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-public-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Public JavaScript syntax
        run: node --check public/site-preview/site.js

      - name: Require public-safe release authority contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'api_public_release_state_v1' public/site-preview/site.js
          if grep -q 'rpc("api_release_clock")' public/site-preview/site.js; then
            echo "::error::Legacy release clock remains authoritative in public site.js"
            exit 1
          fi
          grep -q 'releaseState?.launch_authorized&&!releaseState?.releases_paused' public/site-preview/site.js

      - name: Check finished homepage contracts
        shell: bash
        run: |
          set -euo pipefail
          if grep -E '<input[^>]*id="global-search-input"[^>]*disabled' public/site-preview/index.html; then
            echo "::error::Global search is still disabled."
            exit 1
          fi
          grep -q 'initGlobalSearch' public/site-preview/site.js
          grep -q 'api_entity_search' public/site-preview/site.js
          grep -q 'notificationReadState' public/site-preview/site.js
          grep -q 'initNotificationCenter' public/site-preview/site.js
          grep -q 'genesis_reader_resume_v2' public/site-preview/site.js
          grep -q 'published_at' public/site-preview/site.js
          grep -q 'PART ' public/site-preview/site.js
          grep -q 'hero-atmosphere' public/site-preview/index.html
          grep -q 'prefers-reduced-motion' public/site-preview/site.css
          grep -q 'link.replaceChildren(img)' public/site-preview/site.js
          echo "Homepage functional-contract checks passed."

      - name: Keep Admin and Worker isolation unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$CHANGED"
          FORBIDDEN="$(printf '%s\n' "$CHANGED" | grep -E '^(public/admin/|src/worker\.ts$|src/public-worker\.ts$|wrangler\.live\.toml$|\.github/workflows/deploy-live\.yml$|package\.json$)' || true)"
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Public handoff branch changed protected Admin/Worker authority files:"
            printf '%s\n' "$FORBIDDEN"
            exit 1
          fi

      - name: Result
        run: |
          echo "PUBLIC_HANDOFF_QA_PASS"
          echo "Release countdown uses public-safe backend authority; local schedule remains fallback only."

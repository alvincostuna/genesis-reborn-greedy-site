name: GENESIS Website Visual QA

on:
  push:
    branches:
      - main
      - website-redesign-v1
      - web-ds-v2-home
      - web-ds-v2-6-dashboard
      - web-ds-v2-7-rewards
      - web-ds-v2-7-1-reward-polish
      - web-ds-v2-8-world-codex
      - web-ds-v2-9-final-ui
      - web-ds-v3-release-reward-rules
      - web-ds-v3-auth-security-v2
      - website-finish-v1
      - website-unified-shell-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-website-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Type-check Worker code
        run: npm run types

      - name: Check browser and Admin JavaScript syntax
        run: |
          node --check public/site-preview/site.js
          node --check public/admin/admin.js
          node --check public/admin/read/reader.js

      - name: Audit shared public shell consistency
        run: node scripts/public-shell-consistency-audit.mjs

      - name: Guard WEB-DS V3 logo-alignment contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          css=Path("public/site-preview/site.css").read_text(encoding="utf-8")
          marker="WEB-DS V3.0 — LOGO ALIGNMENT PASS"
          if marker not in css:
              raise SystemExit("V3 logo-alignment marker missing")
          start=css.index(marker)
          block=css[start:]
          required=[
              '--gx3-gold:#D5AE58',
              '--gx3-gold-hi:#F0D488',
              '--gx3-ivory:#F2EEE5',
              '--gx3-red:#A92521',
              '--gx3-display:"Cinzel",Georgia',
              '--gx3-story:"Cormorant Garamond",Georgia',
              '.genesis-btn.primary',
              'background:linear-gradient(180deg,#162738 0%,#0b1927 52%,#07111b 100%)',
              '.deck-reading-panel .deck-panel-header::after',
          ]
          for item in required:
              if item not in block:
                  raise SystemExit(f"Missing V3 contract token/rule: {item}")
          if "url(" in block:
              raise SystemExit("V3 theme layer must not introduce image/font asset URLs")
          print("PASS: WEB-DS V3 logo-alignment source contract")
          PY

      - name: Guard homepage payload budget
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          css=Path("public/site-preview/site.css").read_text(encoding="utf-8")
          start=css.index("/* PERFORMANCE HOTFIX: keep command-deck imagery")
          end=css.index("/* DEPLOY SYNC: APPROVED HOMEPAGE COMMAND DECK V1 */",start)
          block=css[start:end]
          if ".png" in block:
              raise SystemExit("Command deck performance block must not load PNG artwork.")
          required=[
              "/assets/v27/destination-heroes/genesis-atlas-hero.webp",
              "/assets/v27/rewards/flavio-early-cast-wallpaper.webp",
              "/assets/v27/rewards/early-genesis-world-panorama.webp",
          ]
          for asset in required:
              if asset not in block:
                  raise SystemExit(f"Missing optimized command-deck asset: {asset}")
          html=Path("public/site-preview/index.html").read_text(encoding="utf-8")
          if 'rel="preload" as="image" href="/assets/master-key-art-split-world-v1.webp"' not in html:
              raise SystemExit("Hero preload missing.")
          if 'rel="preconnect" href="https://lyhrwymhzhhxszquxnke.supabase.co"' not in html:
              raise SystemExit("Supabase preconnect missing.")
          print("PASS: homepage payload budget contract")
          PY

      - name: Guard public editorial language
        shell: bash
        run: |
          set -euo pipefail
          forbidden='Final Canon|Reader-safe Supabase projection|production database|executed reader-safe|>XXX<|1-DAY ADVANCE|7-DAY ADVANCE|30-DAY ADVANCE'
          if grep -RniE "$forbidden" public/site-preview --include='*.html' --include='*.js'; then
            echo "::error::Internal/obsolete wording leaked into the public reader interface."
            exit 1
          fi
          grep -q 'The first adventure is being prepared.' public/site-preview/site.js
          grep -q 'Begin your journey' public/site-preview/index.html
          grep -q 'Fog of War' public/site-preview/world/index.html
          grep -q 'SPOILER-SAFE' public/site-preview/codex/index.html
          grep -q '2-PART ADVANCE' public/site-preview/support/index.html
          echo "PASS: public editorial language contract"

      - name: Install Playwright Chromium
        run: |
          npm install --legacy-peer-deps --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Detect V2.7 reward asset package
        id: reward_assets
        shell: bash
        run: |
          expected=(
            genesis-awakening.webp
            beginner-hunt.webp
            flavio-nico-early-party.webp
            starter-town-safe-zone.webp
            flavio-reyes.webp
            nico-salazar.webp
            maya-villareal.webp
            young-gnawer.webp
            early-genesis-world-panorama.webp
            flavio-early-cast-wallpaper.webp
          )
          root="public/assets/v27/rewards"
          found=0
          missing=()
          for file in "${expected[@]}"; do
            if [ -f "$root/$file" ]; then
              found=$((found+1))
            else
              missing+=("$file")
            fi
          done
          echo "Found $found/${#expected[@]} V2.7 reward images."
          if [ "$found" -eq 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::V2.7 reward images have not been uploaded yet; real-image QA is deferred."
          elif [ "$found" -ne "${#expected[@]}" ]; then
            printf 'Missing reward image: %s\n' "${missing[@]}"
            echo "::error::Partial V2.7 reward upload detected. Upload all 10 images together."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "PASS: all 10 V2.7 reward images are present."
          fi

      - name: Start isolated static preview
        run: |
          python3 -m http.server 4173 --directory public >/tmp/genesis-http.log 2>&1 &
          echo $! > /tmp/genesis-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/site-preview/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/genesis-http.log
          exit 1

      - name: Render desktop and mobile screenshots
        # Render authenticated profile shell for QA without using a real reader account.
        run: |
          mkdir -p visual-qa
          cat > visual-qa-runner.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base='http://127.0.0.1:4173/site-preview';
          const pages=[
            ['home','/'],
            ['reader','/read/'],
            ['profile','/account/'],
            ['world','/world/'],
            ['codex','/codex/'],
            ['support','/support/'],
            ['quests','/quests/'],
            ['fan','/fan-page/'],
            ['manga','/manga/']
          ];
          const viewports=[
            ['desktop-1440',{width:1440,height:900}],
            ['desktop-1600',{width:1600,height:1000}],
            ['tablet-768',{width:768,height:1024}],
            ['mobile-430',{width:430,height:932}],
            ['mobile-390',{width:390,height:844}]
          ];
          const browser=await chromium.launch({headless:true});
          const report=[];
          for(const [mode,viewport] of viewports){
            const context=await browser.newContext({viewport,deviceScaleFactor:1});

            // Visual QA is deterministic and must not depend on live Supabase/network state.
            // Runtime/API correctness is covered by the separate readiness and deployment gates.
            await context.route('https://lyhrwymhzhhxszquxnke.supabase.co/**',async route=>{
              const url=route.request().url();
              if(url.includes('/rest/v1/rpc/api_public_release_state_v1')){
                return route.fulfill({
                  status:200,
                  contentType:'application/json',
                  body:JSON.stringify([{
                    contract_version:'QA-HOME-RELEASE',
                    server_now:'2026-10-02T10:00:00+08:00',
                    timezone:'Asia/Manila',
                    launch_authorized:true,
                    releases_paused:false,
                    daily_slots:['08:00','14:00','20:00'],
                    release_days:['MON','TUE','WED','THU','FRI','SAT'],
                    sunday_rest:true,
                    next_publish_at:'2026-10-02T14:00:00+08:00',
                    next_cycle_at:'2026-10-02T14:00:00+08:00',
                    next_part:{episode_number:1,part_number:2},
                    released_parts:1
                  }])
                });
              }
              if(url.includes('/rest/v1/rpc/api_release_clock_v2')){
                return route.fulfill({
                  status:200,
                  contentType:'application/json',
                  body:JSON.stringify({
                    contract_version:'QA',
                    timezone:'Asia/Manila',
                    daily_slots:['08:00','14:00','20:00'],
                    release_days:['MON','TUE','WED','THU','FRI','SAT'],
                    sunday_rest:true,
                    next_publish_at:'2026-10-02T14:00:00+08:00',
                    next_cycle_at:'2026-10-02T14:00:00+08:00',
                    launch_authorized:true,
                    releases_paused:false
                  })
                });
              }
              if(url.includes('/rest/v1/rpc/')){
                return route.fulfill({status:200,contentType:'application/json',body:'[]'});
              }
              if(url.includes('/auth/v1/')){
                return route.fulfill({status:401,contentType:'application/json',body:'{"message":"QA signed-out fixture"}'});
              }
              return route.fulfill({status:200,contentType:'application/json',body:'{}'});
            });

            for(const [name,path] of pages){
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push('pageerror: '+e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
              const response=await page.goto(base+path,{waitUntil:'networkidle',timeout:30000});
              if(name==='reader'){
                await page.evaluate(()=>{
                  const head=document.querySelector('#novel-head');
                  const body=document.querySelector('#novel-body');
                  const tabs=document.querySelector('#part-tabs');
                  const list=document.querySelector('#episode-list');
                  const count=document.querySelector('#episode-count');
                  const episodeSelect=document.querySelector('#reader-episode-select');
                  const partSelect=document.querySelector('#reader-part-select');
                  if(count)count.textContent='QA · 3 Episodes';
                  if(episodeSelect){
                    episodeSelect.disabled=false;
                    episodeSelect.innerHTML='<option>Episode 001 — Released Episode</option><option>Episode 002 — Released Episode</option><option>Episode 003 — Released Episode</option>';
                  }
                  if(partSelect){
                    partSelect.disabled=false;
                    partSelect.innerHTML='<option>Part 001 — Reader Typography QA</option><option>Part 002</option><option>Part 003</option>';
                  }
                  if(list)list.innerHTML=
                    '<button class="episode-button active"><small>EPISODE 001</small><strong>Released Episode</strong></button>'+
                    '<button class="episode-button"><small>EPISODE 002</small><strong>Released Episode</strong></button>'+
                    '<button class="episode-button"><small>EPISODE 003</small><strong>Released Episode</strong></button>';
                  if(head)head.innerHTML='<p class="eyebrow">EPISODE 001 · PART 001</p><h2>Reader Typography QA</h2><p>Representative released-reader layout only. No story manuscript is used in this fixture.</p>';
                  if(tabs)tabs.innerHTML='<button class="active">Part 001</button><button>Part 002</button><button>Part 003</button>';
                  if(body)body.innerHTML=
                    '<p>The Reader is designed for long-form fiction with comfortable line length, generous spacing, and clear paragraph rhythm.</p>'+
                    '<p>This representative text exists only for visual QA. It checks typography, mobile width, navigation controls, and reading comfort without using unreleased story material.</p>'+
                    '<p>Desktop readers keep the Episode Library and Reader Tools visible. On smaller screens those controls move into drawers so the manuscript remains the focus.</p>'+
                    '<p>Every released Part should remain readable from beginning to end without horizontal scrolling or clipped text.</p>';
                  const pos=document.querySelector('#reader-position');if(pos)pos.textContent='42% read';
                  const fill=document.querySelector('#reader-progress-fill');if(fill)fill.style.width='42%';
                });
              }
              if(name==='fan'){
                await page.evaluate(()=>{
                  const feed=document.querySelector('#fan-feed');
                  if(feed){
                    const sample=[
                      ['Reader Artwork','/assets/v27/rewards/flavio-early-cast-wallpaper.webp','Community image prepared for moderation.'],
                      ['Official Visual','/assets/v27/rewards/genesis-awakening.webp','Official reader-safe visual post.'],
                      ['Community Gallery','/assets/v27/rewards/early-genesis-world-panorama.webp','Reader-safe community discovery card.']
                    ];
                    feed.innerHTML=sample.map(([name,art,caption],i)=>
                      '<article class="fan-post"><div class="fan-media" style="background-image:linear-gradient(180deg,transparent,rgba(2,8,14,.45)),url(\''+art+'\')"></div>'+
                      '<div class="fan-copy"><div class="fan-author"><strong>'+name+'</strong>'+(i===1?'<span class="reader-badge">OFFICIAL</span>':'')+'</div><p>'+caption+'</p></div></article>'
                    ).join('');
                  }
                });
              }
              if(name==='world'){
                await page.evaluate(()=>{
                  const grid=document.querySelector('#world-grid');
                  if(grid){
                    const sample=[
                      ['ATLAS','map','Discovered Region','Reader-safe public map record.','/assets/v27/rewards/early-genesis-world-panorama.webp','◎'],
                      ['BESTIARY','monster','Field Creature','Reader-safe creature record.','/assets/v27/rewards/young-gnawer.webp','✦'],
                      ['ARMORY','weapon','Revealed Equipment','Reader-safe equipment record.','/assets/v25/releases/release-duel.png','⚔']
                    ];
                    grid.innerHTML=sample.map(([label,type,title,desc,art,icon])=>
                      '<article class="world-card v28-entity-card" data-entity-type="'+type+'">'+
                      '<div class="entity-art" style="background-image:linear-gradient(180deg,rgba(2,8,14,.04),rgba(2,8,14,.82)),url(\''+art+'\')">'+
                      '<span class="entity-symbol">'+icon+'</span><span class="entity-category">'+label+'</span></div>'+
                      '<div class="entity-copy"><small>'+type.toUpperCase()+'</small><h2>'+title+'</h2><p>'+desc+'</p>'+
                      '<div class="reveal-fields"><span>public name</span><span>category</span><span>summary</span></div></div></article>'
                    ).join('');
                  }
                });
              }
              if(name==='codex'){
                await page.evaluate(()=>{
                  const grid=document.querySelector('#codex-results');
                  const count=document.querySelector('#codex-result-count');
                  if(count)count.textContent='8 reader-safe results';
                  if(grid){
                    const sample=[
                      ['BESTIARY','monster','Creature Record','/assets/v27/rewards/young-gnawer.webp','✦'],
                      ['ATLAS','map','Region Record','/assets/v27/rewards/early-genesis-world-panorama.webp','◎'],
                      ['ARMORY','weapon','Weapon Record','/assets/v25/releases/release-duel.png','⚔'],
                      ['ARMORY','armor','Armor Record','/assets/v25/releases/release-duel.png','⚔'],
                      ['ARCHIVE','item','Item Record','/assets/v27/rewards/genesis-awakening.webp','▣'],
                      ['PATH','class','Class Record','/assets/v25/destinations/destination-codex.png','✧'],
                      ['PATH','profession','Profession Record','/assets/v25/destinations/destination-codex.png','✧'],
                      ['QUEST','quest','Quest Record','/assets/v25/releases/release-city.png','◇']
                    ];
                    grid.innerHTML=sample.map(([label,type,title,art,icon])=>
                      '<article class="codex-card v28-entity-card" data-entity-type="'+type+'">'+
                      '<div class="entity-art" style="background-image:linear-gradient(180deg,rgba(2,8,14,.04),rgba(2,8,14,.82)),url(\''+art+'\')">'+
                      '<span class="entity-symbol">'+icon+'</span><span class="entity-category">'+label+'</span></div>'+
                      '<div class="entity-copy"><small>'+type.toUpperCase()+'</small><h2>'+title+'</h2><p>Representative reader-safe database record for visual QA.</p>'+
                      '<div class="reveal-fields"><span>public name</span><span>summary</span><span>type</span></div></div></article>'
                    ).join('');
                  }
                });
              }
              if(name==='quests'){
                await page.evaluate(()=>{
                  const button=document.querySelector('#reward-draw-button');
                  if(button){button.disabled=false;button.textContent='Claim Random Reward · 2 Ready';}
                  const cards=[...document.querySelectorAll('#reward-vault-grid .reward-state-card')];
                  cards.forEach((card,i)=>{
                    card.classList.remove('earned','available','locked');
                    card.classList.add(i<3?'earned':(i===6?'locked':'available'));
                    const label=card.querySelector('.reward-state-copy span');
                    if(label)label.textContent=i<3?(i===2?'Earned ×2':'Earned'):(i===6?'Locked by story progress':'Available in random draw');
                    const lock=card.querySelector('.reward-lock');
                    if(i<3&&lock)lock.remove();
                    else if(lock)lock.textContent=i===6?'🔒':'◇';
                  });
                });
              }
              if(name==='profile'){
                await page.evaluate(()=>{
                  document.querySelector('#auth-guest')?.classList.add('hidden');
                  document.querySelector('#auth-reader')?.classList.remove('hidden');
                  const tier=document.querySelector('#profile-tier-badge'); if(tier)tier.textContent='Tier 10';
                  const exp=document.querySelector('#profile-exp-total'); if(exp)exp.textContent='18,650 EXP';
                  const next=document.querySelector('#profile-next-tier'); if(next)next.textContent='1,350 to next Tier';
                  const bar=document.querySelector('#profile-exp-bar'); if(bar)bar.style.width='32.5%';
                  const latest=document.querySelector('#profile-latest-read'); if(latest)latest.textContent='Episode 024 — Part 003';
                  const parts=document.querySelector('#profile-parts-read'); if(parts)parts.textContent='142';
                  const episodes=document.querySelector('#profile-episodes-complete'); if(episodes)episodes.textContent='23';
                  const count=document.querySelector('#profile-collection-count'); if(count)count.textContent='4 Unlocked';
                  const pending=document.querySelector('#profile-pending-draws'); if(pending)pending.textContent='2 Reward Draws Ready';
                  const grid=document.querySelector('#profile-collection-grid');
                  if(grid){
                    const rewards=[
                      ['Genesis Awakening','genesis-awakening.webp','earned','COMMON · PICTURE CARD','Earned'],
                      ['Flavio Reyes','flavio-reyes.webp','earned','COMMON · CHARACTER PICTURE','Earned'],
                      ['Young Gnawer','young-gnawer.webp','earned','COMMON · MONSTER PICTURE','Earned ×2'],
                      ['Early GENESIS World Panorama','early-genesis-world-panorama.webp','earned','RARE · DESKTOP WALLPAPER','Earned'],
                      ['Beginner Hunt','beginner-hunt.webp','available','UNCOMMON · PICTURE CARD','Available in random draw'],
                      ['Amihan “Maya” Villareal','maya-villareal.webp','locked','RARE · CHARACTER PICTURE','Locked by story progress']
                    ];
                    grid.innerHTML=rewards.map(([title,file,state,meta,label])=>
                      '<article class="reward-state-card compact '+state+'">'+
                      '<div class="reward-state-art"><img src="/assets/v27/rewards/'+file+'" alt="">'+
                      (state==='earned'?'':'<span class="reward-lock">'+(state==='locked'?'🔒':'◇')+'</span>')+'</div>'+
                      '<div class="reward-state-copy"><small>'+meta+'</small><strong>'+title+'</strong><span>'+label+'</span></div></article>'
                    ).join('');
                  }
                });
              }
              if(name==='home'){
                await page.evaluate(()=>{
                  const set=(selector,value)=>{const el=document.querySelector(selector);if(el)el.textContent=value};
                  set('#home-reading-episode','EPISODE 012 · PART 004');
                  set('#home-reading-title','The Path Widens');
                  set('#home-reading-summary','Representative reader-safe copy used only to validate the approved command-deck hierarchy, spacing, and typography.');
                  const cont=document.querySelector('#home-reading-continue');if(cont)cont.innerHTML='<span aria-hidden="true">▣</span> Continue Reading';
                  const guest=document.querySelector('#home-access-guest');
                  const reader=document.querySelector('#home-access-reader');
                  if(guest)guest.hidden=true;
                  if(reader)reader.hidden=false;
                  set('#home-access-name','QA Reader');
                  set('#home-access-title','Genesis Veteran');
                  set('#home-access-tier','Tier 10');
                  set('#home-access-exp-total','1,350 / 2,000 EXP');
                  set('#home-access-next-tier','Next Tier in 650');
                  set('#home-access-advance','17 Parts Ahead');
                  set('#home-access-support','Veteran');
                  set('#home-access-reader-exp','1,350 EXP');
                  set('#home-access-progress','Episode 012 · Part 004');
                  set('#home-access-collectibles','12 / 24');
                  const fill=document.querySelector('#home-access-exp-fill');if(fill)fill.style.width='67.5%';
                  const latest=document.querySelector('#home-latest-releases');
                  if(latest)latest.innerHTML=
                    '<a class="deck-release-card deck-release-card-1" href="#"><span class="deck-release-thumb"></span><span class="deck-release-copy"><small>EPISODE 012 · PART 003</small><strong>Unexpected Allies</strong><em>Sep 27, 2026 · 8:00 AM</em></span><b>›</b></a>'+
                    '<a class="deck-release-card deck-release-card-2" href="#"><span class="deck-release-thumb"></span><span class="deck-release-copy"><small>EPISODE 012 · PART 002</small><strong>The Hidden Path</strong><em>Sep 26, 2026 · 8:00 PM</em></span><b>›</b></a>'+
                    '<a class="deck-release-card deck-release-card-3" href="#"><span class="deck-release-thumb"></span><span class="deck-release-copy"><small>EPISODE 012 · PART 001</small><strong>A New Direction</strong><em>Sep 26, 2026 · 8:00 AM</em></span><b>›</b></a>';
                  const announcements=document.querySelector('#home-announcements');
                  if(announcements)announcements.innerHTML=
                    '<div class="deck-announcement-row"><span class="deck-announcement-icon">⌂</span><p><strong>Latest public release</strong><small>Episode 012 · Part 004 · QA fixture</small></p><time>2h ago</time></div>'+
                    '<div class="deck-announcement-row"><span class="deck-announcement-icon">◷</span><p><strong>Official release cycle</strong><small>8:00 AM · 2:00 PM · 8:00 PM · Monday–Saturday</small></p><time>PHT</time></div>'+
                    '<div class="deck-announcement-row"><span class="deck-announcement-icon">◇</span><p><strong>Support GENESIS</strong><small>Reader support and access options.</small></p><time>Open</time></div>';
                });

                const design=await page.evaluate(({mode})=>{
                  const visible=el=>!!el&&getComputedStyle(el).display!=='none'&&getComputedStyle(el).visibility!=='hidden';
                  const rect=el=>el?.getBoundingClientRect();
                  const hero=document.querySelector('.cinematic-split-hero');
                  const media=document.querySelector('.cinematic-hero-media');
                  const deck=document.querySelector('.genesis-command-deck');
                  const top=document.querySelector('.genesis-command-top');
                  const left=document.querySelector('.deck-release-panel');
                  const center=document.querySelector('.deck-reading-panel');
                  const right=document.querySelector('.deck-access-panel');
                  const latest=document.querySelector('.deck-latest-panel');
                  const announcements=document.querySelector('.deck-announcements-panel');
                  const slots=[...document.querySelectorAll('[data-release-slot]')];
                  const countdown=[...document.querySelectorAll('.home-countdown-grid>div')];
                  const issues=[];
                  if(!visible(deck))issues.push('command deck missing');
                  if(document.querySelector('.lean-story-section'))issues.push('redundant story panel still present');
                  if(document.querySelector('.lean-world-teaser'))issues.push('redundant world teaser still present');
                  if(document.querySelector('#latest-release-section'))issues.push('legacy latest-release section still present');
                  if(slots.length!==3)issues.push('release slot count is not 3');
                  if(countdown.length!==3)issues.push('countdown cell count is not 3');
                  if(!hero||!media||!deck||!top||!left||!center||!right||!latest||!announcements)return {issues:[...issues,'command deck structure incomplete']};

                  const hr=rect(hero),mr=rect(media),dr=rect(deck),lr=rect(left),cr=rect(center),rr=rect(right),lwr=rect(latest),ar=rect(announcements);
                  if(dr.top<hr.bottom-2)issues.push('command deck overlaps cinematic hero');

                  if(mode.startsWith('desktop-')){
                    const navLinks=[...document.querySelectorAll('.v2-primary-nav a')];
                    const activeNav=document.querySelector('.v2-primary-nav a.active');
                    if(navLinks.length!==7)issues.push('desktop primary nav count is not 7');
                    for(const link of navLinks){
                      const icon=link.querySelector('.v25-icon');
                      if(link.getBoundingClientRect().height<74)issues.push('desktop nav target below 74px');
                      if(icon&&icon.getBoundingClientRect().width<26)issues.push('desktop nav icon below 26px');
                      if(parseFloat(getComputedStyle(link).fontSize)<11.5)issues.push('desktop nav label below 11.5px');
                    }
                    if(activeNav&&getComputedStyle(activeNav).backgroundImage==='none')issues.push('desktop active nav lacks HUD background');
                    const near=(actual,target,tolerance,label)=>{if(Math.abs(actual-target)>tolerance)issues.push(label+' '+actual.toFixed(1)+'px != '+target.toFixed(1)+'±'+tolerance+'px')};
                    near(dr.left,hr.left,2,'deck left edge vs hero');
                    near(dr.right,hr.right,2,'deck right edge vs hero');
                    near(dr.width,hr.width,2,'deck width vs hero');
                    near(dr.height,dr.width/2.8,3,'deck 2.8:1 height');
                    near(cr.left-lr.right,10,2,'left/center gap');
                    near(rr.left-cr.right,10,2,'center/right gap');
                    near(ar.left-lwr.right,10,2,'lower gap');

                    const topUsable=lr.width+cr.width+rr.width;
                    const leftShare=lr.width/topUsable;
                    const centerShare=cr.width/topUsable;
                    const rightShare=rr.width/topUsable;
                    near(leftShare,400/1360,.012,'next release proportion');
                    near(centerShare,520/1360,.012,'currently reading proportion');
                    near(rightShare,440/1360,.012,'your access proportion');

                    const lowerUsable=lwr.width+ar.width;
                    near(lwr.width/lowerUsable,860/1370,.012,'latest releases proportion');
                    near(ar.width/lowerUsable,510/1370,.012,'announcements proportion');

                    if(cr.width<=lr.width||cr.width<=rr.width)issues.push('currently reading is not the largest upper panel');
                    const releaseSize=parseFloat(getComputedStyle(document.querySelector('#home-release-time')).fontSize);
                    const readingTitle=document.querySelector('#home-reading-title');
                    const readingSize=parseFloat(getComputedStyle(readingTitle).fontSize);
                    const panelHeader=document.querySelector('.deck-reading-panel .deck-panel-header');
                    const primaryCta=document.querySelector('.deck-reading-actions .genesis-btn.primary');
                    const accessTitle=document.querySelector('.home-access-identity strong');
                    const headerColor=getComputedStyle(panelHeader).color;
                    const primaryBg=getComputedStyle(primaryCta).backgroundImage;
                    const displayFamily=getComputedStyle(panelHeader).fontFamily.toLowerCase();
                    const storyFamily=getComputedStyle(readingTitle).fontFamily.toLowerCase();
                    if(!displayFamily.includes('cinzel')&&!displayFamily.includes('georgia'))issues.push('V3 display font stack missing');
                    if(!storyFamily.includes('cormorant')&&!storyFamily.includes('georgia'))issues.push('V3 story font stack missing');
                    if(headerColor!=='rgb(240, 212, 136)')issues.push('V3 panel header ceremonial gold missing: '+headerColor);
                    if(!primaryBg.includes('linear-gradient'))issues.push('V3 primary CTA gradient missing');
                    if(parseFloat(getComputedStyle(accessTitle).fontSize)<18.5)issues.push('V3 access identity title too small');
                    near(releaseSize,34,1,'release time font');
                    near(readingSize,28,1,'V3 reading title font');
                    const tiny=[...deck.querySelectorAll('span,strong,small,p,h2,a,time,em')]
                      .filter(el=>visible(el)&&el.textContent.trim()&&parseFloat(getComputedStyle(el).fontSize)<9.95)
                      .map(el=>el.textContent.trim().slice(0,28));
                    if(tiny.length)issues.push('meaningful desktop text below 10px: '+tiny.slice(0,5).join(' | '));
                    if(lr.height<300||cr.height<300||rr.height<300)issues.push('upper panels shorter than contract');
                    if(lwr.height<154||ar.height<154)issues.push('lower panels shorter than contract');
                  }else{
                    if(dr.top<mr.bottom-2)issues.push('mobile/tablet command overlaps artwork');
                    const mobileBottom=document.querySelector('.v2-mobile-bottom');
                    const mobileMenu=document.querySelector('.v2-mobile-menu');
                    if(mode.startsWith('mobile-')){
                      if(mobileMenu&&mobileMenu.getBoundingClientRect().width<39)issues.push('mobile menu target below 39px');
                      if(mobileBottom&&mobileBottom.getBoundingClientRect().height<60)issues.push('mobile bottom nav below 60px');
                      const mobileIcons=[...document.querySelectorAll('.v2-mobile-bottom .v25-icon')];
                      if(mobileIcons.some(icon=>icon.getBoundingClientRect().width<20))issues.push('mobile bottom nav icon below 20px');
                      const readingPanel=document.querySelector('.deck-reading-panel');
                      if(readingPanel&&readingPanel.getBoundingClientRect().height>250)issues.push('mobile currently-reading panel retains oversized blank cavity');
                    }
                    const primary=document.querySelector('.deck-reading-actions .genesis-btn.primary');
                    if(mode.startsWith('mobile-')&&visible(primary)&&primary.getBoundingClientRect().height<40)issues.push('phone primary target below 40px');
                  }
                  return {issues,hero:{w:hr.width,h:hr.height},deck:{w:dr.width,h:dr.height}};
                },{mode});
                for(const issue of design.issues)errors.push('design: '+issue);
              }
              await page.screenshot({path:`visual-qa/${name}-${mode}.png`,fullPage:true});
              const body=await page.locator('body').boundingBox();
              const viewportWidth=viewport.width;
              const scrollWidth=await page.evaluate(()=>document.documentElement.scrollWidth);
              const overflow=scrollWidth>viewportWidth+2;
              report.push({name,mode,status:response?.status()??0,scrollWidth,viewportWidth,overflow,errors});
              await page.close();
            }
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('visual-qa/report.json',JSON.stringify(report,null,2));
          const bad=report.filter(x=>x.status>=400||x.overflow||x.errors.some(e=>!e.includes('Failed to fetch')));
          console.log(JSON.stringify(report,null,2));
          if(bad.length){
            console.error('Visual QA detected blocking render defects:',bad);
            process.exit(1);
          }
          JS
          node visual-qa-runner.mjs


      - name: Render V2.7 real reward asset QA
        if: steps.reward_assets.outputs.ready == 'true'
        run: |
          cat > reward-assets-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const files=[
            'genesis-awakening.webp',
            'beginner-hunt.webp',
            'flavio-nico-early-party.webp',
            'starter-town-safe-zone.webp',
            'flavio-reyes.webp',
            'nico-salazar.webp',
            'maya-villareal.webp',
            'young-gnawer.webp',
            'early-genesis-world-panorama.webp',
            'flavio-early-cast-wallpaper.webp'
          ];
          const base='http://127.0.0.1:4173/assets/v27/rewards/';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1200}});

          await page.setContent(`
            <style>
              body{margin:0;background:#030912;color:#f5df9a;font:16px system-ui;padding:24px}
              h1{font:700 28px Georgia,serif;margin:0 0 18px}
              .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
              figure{margin:0;background:#071522;border:1px solid #8c7139;padding:10px}
              img{width:100%;height:320px;object-fit:cover;display:block;background:#02070c}
              img.portrait{object-fit:contain;background:
                radial-gradient(circle at 50% 20%,rgba(55,126,180,.12),transparent 42%),
                #02070c}
              figcaption{padding:10px 2px 2px;color:#cbd9e4;font-size:13px}
            </style>
            <h1>GENESIS V2.7 — Reward Asset QA</h1>
            <div class="grid">
              ${files.map(f=>{
                const portrait=['flavio-reyes.webp','nico-salazar.webp','maya-villareal.webp'].includes(f);
                return `<figure><img class="${portrait?'portrait':''}" data-file="${f}" src="${base+f}"><figcaption>${f}</figcaption></figure>`;
              }).join('')}
            </div>`);

          await page.waitForFunction(
            expected => [...document.images].length===expected && [...document.images].every(img=>img.complete),
            files.length,
            {timeout:30000}
          );

          const results=await page.evaluate(()=>[...document.images].map(img=>({
            file:img.dataset.file,
            status:img.naturalWidth>0?200:0,
            width:img.naturalWidth,
            height:img.naturalHeight
          })));

          const bad=results.filter(x=>x.status!==200||x.width<800||x.height<800);
          fs.writeFileSync('visual-qa/reward-assets-report.json',JSON.stringify(results,null,2));
          await page.screenshot({path:'visual-qa/reward-assets-desktop.png',fullPage:true});
          await browser.close();

          console.log(JSON.stringify(results,null,2));
          if(bad.length){
            console.error('Blocking V2.7 reward asset defects:',bad);
            process.exit(1);
          }
          JS
          node reward-assets-qa.mjs


name: GENESIS Website Visual QA

on:
  push:
    branches:
      - website-redesign-v1
      - web-ds-v2-home
      - web-ds-v2-6-dashboard
      - web-ds-v2-7-rewards
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-website-visual-qa
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Type-check Worker code
        run: npm run types

      - name: Check browser JavaScript syntax
        run: node --check public/site-preview/site.js

      - name: Install Playwright Chromium
        run: |
          npm install --legacy-peer-deps --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Detect V2.7 reward asset package
        id: reward_assets
        shell: bash
        run: |
          expected=(
            genesis-awakening.webp
            beginner-hunt.webp
            flavio-nico-early-party.webp
            starter-town-safe-zone.webp
            flavio-reyes.webp
            nico-salazar.webp
            maya-villareal.webp
            young-gnawer.webp
            early-genesis-world-panorama.webp
            flavio-early-cast-wallpaper.webp
          )
          root="public/assets/v27/rewards"
          found=0
          missing=()
          for file in "${expected[@]}"; do
            if [ -f "$root/$file" ]; then
              found=$((found+1))
            else
              missing+=("$file")
            fi
          done
          echo "Found $found/${#expected[@]} V2.7 reward images."
          if [ "$found" -eq 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::V2.7 reward images have not been uploaded yet; real-image QA is deferred."
          elif [ "$found" -ne "${#expected[@]}" ]; then
            printf 'Missing reward image: %s\n' "${missing[@]}"
            echo "::error::Partial V2.7 reward upload detected. Upload all 10 images together."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "PASS: all 10 V2.7 reward images are present."
          fi

      - name: Start isolated static preview
        run: |
          python3 -m http.server 4173 --directory public >/tmp/genesis-http.log 2>&1 &
          echo $! > /tmp/genesis-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/site-preview/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/genesis-http.log
          exit 1

      - name: Render desktop and mobile screenshots
        # Render authenticated profile shell for QA without using a real reader account.
        run: |
          mkdir -p visual-qa
          cat > visual-qa-runner.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base='http://127.0.0.1:4173/site-preview';
          const pages=[
            ['home','/'],
            ['reader','/read/'],
            ['profile','/account/'],
            ['world','/world/'],
            ['codex','/codex/'],
            ['support','/support/'],
            ['quests','/quests/']
          ];
          const viewports=[
            ['desktop',{width:1440,height:1100}],
            ['mobile',{width:390,height:844}]
          ];
          const browser=await chromium.launch({headless:true});
          const report=[];
          for(const [mode,viewport] of viewports){
            const context=await browser.newContext({viewport,deviceScaleFactor:1});
            for(const [name,path] of pages){
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push('pageerror: '+e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
              const response=await page.goto(base+path,{waitUntil:'networkidle',timeout:30000});
              if(name==='profile'){
                await page.evaluate(()=>{
                  document.querySelector('#auth-guest')?.classList.add('hidden');
                  document.querySelector('#auth-reader')?.classList.remove('hidden');
                  const tier=document.querySelector('#profile-tier-badge'); if(tier)tier.textContent='Tier 10';
                  const exp=document.querySelector('#profile-exp-total'); if(exp)exp.textContent='18,650 EXP';
                  const next=document.querySelector('#profile-next-tier'); if(next)next.textContent='1,350 to next Tier';
                  const bar=document.querySelector('#profile-exp-bar'); if(bar)bar.style.width='32.5%';
                  const latest=document.querySelector('#profile-latest-read'); if(latest)latest.textContent='Episode 024 — Part 003';
                  const parts=document.querySelector('#profile-parts-read'); if(parts)parts.textContent='142';
                  const episodes=document.querySelector('#profile-episodes-complete'); if(episodes)episodes.textContent='23';
                });
              }
              await page.screenshot({path:`visual-qa/${name}-${mode}.png`,fullPage:true});
              const body=await page.locator('body').boundingBox();
              const viewportWidth=viewport.width;
              const scrollWidth=await page.evaluate(()=>document.documentElement.scrollWidth);
              const overflow=scrollWidth>viewportWidth+2;
              report.push({name,mode,status:response?.status()??0,scrollWidth,viewportWidth,overflow,errors});
              await page.close();
            }
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('visual-qa/report.json',JSON.stringify(report,null,2));
          const bad=report.filter(x=>x.status>=400||x.overflow||x.errors.some(e=>!e.includes('Failed to fetch')));
          console.log(JSON.stringify(report,null,2));
          if(bad.length){
            console.error('Visual QA detected blocking render defects:',bad);
            process.exit(1);
          }
          JS
          node visual-qa-runner.mjs


      - name: Render V2.7 real reward asset QA
        if: steps.reward_assets.outputs.ready == 'true'
        run: |
          cat > reward-assets-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const files=[
            'genesis-awakening.webp',
            'beginner-hunt.webp',
            'flavio-nico-early-party.webp',
            'starter-town-safe-zone.webp',
            'flavio-reyes.webp',
            'nico-salazar.webp',
            'maya-villareal.webp',
            'young-gnawer.webp',
            'early-genesis-world-panorama.webp',
            'flavio-early-cast-wallpaper.webp'
          ];
          const base='http://127.0.0.1:4173/assets/v27/rewards/';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1200}});
          const results=[];
          for(const file of files){
            const response=await page.goto(base+file,{waitUntil:'load',timeout:30000});
            const status=response?.status()??0;
            const meta=await page.evaluate(()=>{
              const img=document.querySelector('img');
              return img?{width:img.naturalWidth,height:img.naturalHeight}:{width:0,height:0};
            });
            results.push({file,status,...meta});
          }
          const bad=results.filter(x=>x.status!==200||x.width<800||x.height<800);
          fs.writeFileSync('visual-qa/reward-assets-report.json',JSON.stringify(results,null,2));

          await page.setContent(`
            <style>
              body{margin:0;background:#030912;color:#f5df9a;font:16px system-ui;padding:24px}
              h1{font:700 28px Georgia,serif;margin:0 0 18px}
              .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
              figure{margin:0;background:#071522;border:1px solid #8c7139;padding:10px}
              img{width:100%;height:320px;object-fit:cover;display:block;background:#02070c}
              figcaption{padding:10px 2px 2px;color:#cbd9e4;font-size:13px}
            </style>
            <h1>GENESIS V2.7 — Reward Asset QA</h1>
            <div class="grid">
              ${files.map(f=>`<figure><img src="${base+f}"><figcaption>${f}</figcaption></figure>`).join('')}
            </div>`);
          await page.waitForLoadState('networkidle');
          await page.screenshot({path:'visual-qa/reward-assets-desktop.png',fullPage:true});
          await browser.close();

          console.log(JSON.stringify(results,null,2));
          if(bad.length){
            console.error('Blocking V2.7 reward asset defects:',bad);
            process.exit(1);
          }
          JS
          node reward-assets-qa.mjs

      - name: Upload rendered QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-web-visual-qa
          path: visual-qa/
          retention-days: 14

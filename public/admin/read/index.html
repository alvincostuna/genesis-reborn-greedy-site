<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#07101b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GENESIS Admin Reader</title>
  <link rel="icon" type="image/png" href="/assets/genesis-official-logo-64.png">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="stylesheet" href="/admin/read/reader.css">
</head>
<body>
  <header class="reader-topbar">
    <div class="reader-title-wrap">
      <p id="part-key">GENESIS ADMIN</p>
      <h1 id="part-title">Loading manuscript…</h1>
    </div>
    <button id="reader-font" class="circle-btn" type="button" aria-label="Reading controls">Aa</button>
    <button id="reader-close" class="circle-btn close-btn" type="button" aria-label="Close reader">×</button>
  </header>

  <section id="reader-controls" class="reader-controls" hidden>
    <button id="font-down" type="button">A−</button>
    <span id="font-label">24px</span>
    <button id="font-up" type="button">A+</button>
    <button id="stage-button" type="button">Stage</button>
  </section>

  <main id="reader-scroll">
    <article id="reader-body" class="reader-body">Loading manuscript…</article>
  </main>

  <script type="module" src="/admin/read/reader.js"></script>
</body>
</html>
